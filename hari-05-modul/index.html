<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hari 05 — Modul Matematika</title>
    <style>
        body {
            font-family: system-ui, sans-serif;
            max-width: 480px;
            margin: 40px auto;
            padding: 0 16px;
        }

        input[type="text"] {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
            margin: 6px 0;
        }

        button {
            padding: 8px 16px;
            cursor: pointer;
        }

        .hasil {
            margin-top: 16px;
            padding: 12px;
            background: #f4f4f8;
            border-radius: 8px;
        }

        .hasil p {
            margin: 6px 0;
        }

        #pesan {
            color: #666;
            font-size: 0.9em;
        }
    </style>
</head>

<body>
    <h1>Pengolah Nilai</h1>

    <label for="input-nilai">Masukkan nilai (pisahkan dengan koma):</label>
    <input id="input-nilai" type="text" placeholder="contoh: 80, 90, 75, 60">

    <button id="proses">Hitung</button>

    <div class="hasil">
        <p>Rata-rata: <strong id="hasil-rata">-</strong></p>
        <p>Tertinggi: <strong id="hasil-tinggi">-</strong></p>
        <p>Terendah: <strong id="hasil-rendah">-</strong></p>
        <p id="pesan"></p>
    </div>

    <script type="module" src="js/app.js"></script>
</body>

</html>
