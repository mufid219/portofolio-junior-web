<h2 id="angka">0</h2>
<button id="tambah">Tambah</button>
<button id="kurang">Kurang</button>
<button id="reset">Reset</button>

<form id="form-tugas">
    <label for="teks-tugas">Tugas baru</label>
    <input id="teks-tugas" required maxlength="80">
    <button type="submit">Tambah</button>
</form>

<p id="info-tugas">0 tugas tersisa</p>
<ul id="daftar-tugas"></ul>

<style>
    #daftar-tugas li {
        cursor: pointer;
        padding: 4px 0;
        user-select: none;
    }

    #daftar-tugas li.selesai {
        text-decoration: line-through;
        color: #888;
    }

    #daftar-tugas button {
        margin-left: 8px;
        cursor: pointer;
    }
</style>

<script>
    // ====== Bagian penghitung angka (tidak berubah) ======
    let hitung = 0;
    const angka = document.getElementById("angka");
    const perbarui = () => { angka.textContent = hitung; };

    document.getElementById("tambah").addEventListener("click", () => {
        hitung++; perbarui();
    });
    document.getElementById("kurang").addEventListener("click", () => {
        hitung--; perbarui();
    });
    document.getElementById("reset").addEventListener("click", () => {
        hitung = 0; perbarui();
    });

    // ====== Bagian daftar tugas ======
    const form = document.getElementById("form-tugas");
    const daftar = document.getElementById("daftar-tugas");
    const infoTugas = document.getElementById("info-tugas");
    const MAX_PANJANG = 80;

    /**
     * Hitung ulang dan tampilkan jumlah tugas yang belum selesai.
     * @returns {void}
     */
    function perbaruiJumlahTugas() {
        const total = daftar.querySelectorAll("li").length;
        const selesai = daftar.querySelectorAll("li.selesai").length;
        const tersisa = total - selesai;
        infoTugas.textContent = `${tersisa} tugas tersisa`;
    }

    // Delegasi klik pada <ul>:
    // - Klik area LI (bukan tombol)  -> toggle class 'selesai'
    // - Klik tombol Hapus            -> diabaikan, ditangani handler tombol
    daftar.addEventListener("click", (event) => {
        if (event.target.tagName === "BUTTON") return; // biarkan tombol Hapus bekerja
        const item = event.target.closest("li");
        if (!item) return;
        item.classList.toggle("selesai");
        perbaruiJumlahTugas();
    });

    form.addEventListener("submit", (event) => {
        event.preventDefault();
        const input = document.getElementById("teks-tugas");
        const teks = input.value.trim();

        if (teks === "") return;
        if (teks.length > MAX_PANJANG) {
            alert(`Teks maksimal ${MAX_PANJANG} karakter.`);
            return;
        }

        const item = document.createElement("li");
        item.textContent = teks + " ";

        const hapus = document.createElement("button");
        hapus.type = "button";
        hapus.textContent = "Hapus";
        hapus.addEventListener("click", () => {
            item.remove();
            perbaruiJumlahTugas();
        });

        item.append(hapus);
        daftar.append(item);

        form.reset();
        perbaruiJumlahTugas();
        input.focus();
    });

    // Inisialisasi tampilan awal
    perbaruiJumlahTugas();
</script>
